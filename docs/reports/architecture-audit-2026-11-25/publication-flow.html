<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Публикация школьной недели</title><style>body{margin:4vw;background:#f6f8fc;color:#202339;font:16px/1.6 "Segoe UI",sans-serif}main{max-width:1200px;margin:auto}h1{font-size:clamp(24px,3.5vw,42px);line-height:1.2}figure{margin:32px 0;overflow:auto}svg{display:block;background:#fff;border:1px solid #dce2ec;border-radius:12px;min-width:900px;width:99%;height:auto}text{font:600 17px "Segoe UI",sans-serif;text-anchor:middle}.sub{font-size:13px;font-weight:400}figcaption{margin-top:12px;max-width:84ch}</style><main><h1>Публикация школьной недели</h1><p>Предлагаемый поток после добавления квитанции команды и привязки Google Sheets к неделе.</p><figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 370" role="img" aria-labelledby="publication-flow-title publication-flow-desc"><title id="publication-flow-title">Две ветви после публикации</title><desc id="publication-flow-desc">После одной транзакции школьные экраны читают утверждённую редакцию, а исполнитель отдельно обновляет постоянную вкладку недели в Google Sheets.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 z" fill="#285ce0"/></marker></defs><g fill="none" stroke="#285ce0" stroke-width="2" marker-end="url(#arrow)"><path d="M236 185 H292"/><path d="M524 167 H546 Q554 167 554 159 V88 Q554 80 562 80 H594"/><path d="M524 205 H546 Q554 205 554 213 V282 Q554 290 562 290 H594"/><path d="M863 290 H927"/></g><g transform="translate(30 145)"><rect width="206" height="80" rx="10" fill="white" stroke="#b8c3d7"/><text x="103" y="33" fill="#202339">Черновик недели</text><text class="sub" x="103" y="56" fill="#515e75">версия и локальные правки</text></g><g transform="translate(296 145)"><rect width="228" height="80" rx="10" fill="#202339" stroke="#b8c3d7"/><text x="114" y="33" fill="white">Публикация в БД</text><text class="sub" x="114" y="56" fill="#e3e8fa">head · история · квитанция</text></g><g transform="translate(598 40)"><rect width="265" height="80" rx="10" fill="white" stroke="#b8c3d7"/><text x="132.5" y="33" fill="#202339">Чтение по редакции</text><text class="sub" x="132.5" y="56" fill="#515e75">Campus · preview · «Сегодня»</text></g><g transform="translate(598 250)"><rect width="265" height="80" rx="10" fill="white" stroke="#b8c3d7"/><text x="132.5" y="33" fill="#202339">Задача выгрузки</text><text class="sub" x="132.5" y="56" fill="#515e75">повторы и проверка маркера</text></g><g transform="translate(931 250)"><rect width="202" height="80" rx="10" fill="white" stroke="#b8c3d7"/><text x="101" y="33" fill="#202339">Лист недели</text><text class="sub" x="101" y="56" fill="#515e75">постоянный gid</text></g></svg><figcaption>Доступ к опубликованным занятиям появляется после commit. Сбой Google виден в статусе выгрузки. Повторная доставка использует тот же лист и проверяет, какая редакция на нём записана.</figcaption></figure></main></html>
