<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 245" width="850" height="245" role="img" aria-labelledby="t d"><title id="t">Переход от списка к записи</title><desc id="d">В А каталог, подробности и форма последовательно занимают рабочую область. В Б список и выбранная запись доступны рядом, из записи открывается форма.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#59627b" stroke-width="1.6"/></marker></defs><rect width="850" height="245" rx="12" fill="#f6f8fc"/><g font-family="Arial,sans-serif" fill="#202339"><text x="24" y="34" font-size="18" font-weight="bold">А · последовательные экраны</text><text x="24" y="148" font-size="18" font-weight="bold">Б · выбор остаётся в поле зрения</text><g stroke="#c2cada" fill="#fff"><rect x="24" y="53" width="206" height="44" rx="5"/><rect x="310" y="53" width="206" height="44" rx="5"/><rect x="600" y="53" width="220" height="44" rx="5"/><rect x="24" y="166" width="492" height="56" rx="5"/><rect x="600" y="172" width="220" height="44" rx="5"/></g><rect x="34" y="176" width="159" height="36" rx="4" fill="#fff1ab"/><path d="M211 166v56" stroke="#c2cada"/><g stroke="#59627b" stroke-width="1.5" marker-end="url(#arr)"><path d="M240 75h60"/><path d="M528 75h60"/><path d="M528 194h60"/></g><g font-size="16" text-anchor="middle"><text x="127" y="81">Каталог</text><text x="413" y="81">Карточка человека</text><text x="710" y="81">Редактирование</text><text x="111" y="200">Выбор в списке</text><text x="361" y="200">Связанные назначения</text><text x="710" y="200">Редактирование</text></g></g></svg>