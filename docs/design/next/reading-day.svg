<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d"><title id="t">Как завуч читает школьный день</title><desc id="d">Из опубликованной недели выбирается день. Изменение ведёт к уроку и затронутой группе. Черновик следующей недели показан отдельной линией и ведёт к проверке готовности.</desc><rect width="900" height="260" fill="#f6f8fc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#53617b" stroke-width="1.5"/></marker></defs><g font-family="Arial,sans-serif" fill="#202339"><text x="24" y="32" font-size="20" font-weight="700">Что происходит в школе сегодня?</text><g stroke="#bec8d8" fill="white"><rect x="24" y="65" width="212" height="66" rx="5"/><rect x="320" y="65" width="220" height="66" rx="5" fill="#fff3bd"/><rect x="628" y="65" width="248" height="66" rx="5"/><rect x="24" y="170" width="212" height="60" rx="5" stroke-dasharray="5 3"/><rect x="320" y="170" width="220" height="60" rx="5"/></g><g stroke="#53617b" marker-end="url(#arrow)"><path d="M244 98h65"/><path d="M548 98h68"/><path d="M244 201h65"/></g><g font-size="16" font-weight="600"><text x="38" y="91">Опубликованный день</text><text x="336" y="91">Изменение в занятии</text><text x="645" y="91">Первичная запись</text><text x="38" y="196">Следующая неделя</text><text x="336" y="196">Проверка готовности</text></g><g fill="#515b70" font-size="14"><text x="38" y="115">Кто, когда и где учится</text><text x="336" y="115">Замена, отмена, перенос</text><text x="645" y="115">Урок, группа и участники</text><text x="38" y="217">Черновик администрации</text><text x="336" y="217">Что требует решения</text></g></g></svg>
