name: Architecture integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHON_DOTENV_DISABLED: '1'
jobs:
  backend:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s backend/tests -v
  frontend:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test components/*.test.mjs e2e/*.test.mjs
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8011
  browser:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-playwright-evidence
          path: .local-test/e2e-workspace/.local-test/playwright-results
          if-no-files-found: ignore

  postgres:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: my_island_migration_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIXTURE_DSN: postgresql://postgres@127.0.0.1:55432/my_island_migration_test
      MY_ISLAND_RELEASE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/my_island_release_check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - name: Reconstruct the previous schema and migrate synthetic school rows
        shell: bash
        run: |
          psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon;
          CREATE ROLE authenticated;
          CREATE ROLE service_role BYPASSRLS;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          SQL
          for migration in backend/migrations/*.sql; do
            case "$migration" in
              */044_*) continue ;; # Supabase cron/net are external to this fixture.
              */045_*)
                # Apply the schema prefix. The remaining one-off backfill requires an exact production roster.
                { sed '/^-- The user explicitly identified/,$d' "$migration"; echo 'COMMIT;'; } |
                  psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1
                continue ;;
              */016_*)
                # On a fresh bootstrap 013 already created the trigger that 016 replaces.
                psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 -c 'DROP TRIGGER school_source_mappings_protect_manual ON school_source_mappings'
                ;;
              */054_*)
                psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 -f backend/tests/fixtures/architecture_before_migrations.sql
                ;;
            esac
            psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 -f backend/tests/fixtures/architecture_after_migrations.sql
          psql "$FIXTURE_DSN" -q -v ON_ERROR_STOP=1 -c 'CREATE DATABASE my_island_release_check'
          pg_dump --schema-only "$FIXTURE_DSN" | psql "$MY_ISLAND_RELEASE_TEST_DATABASE_URL" -q -v ON_ERROR_STOP=1
      - name: Verify real transactions, journals and role boundaries
        run: >-
          python -m unittest backend.tests.test_publication_partial_postgres
          backend.tests.test_journal_import_postgres backend.tests.test_journal_current_period_postgres
          backend.tests.test_codex_diagnostic_budget_postgres -v
