name: Architecture integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHON_DOTENV_DISABLED: '1'
jobs:
  backend:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s backend/tests -v
  frontend:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test components/*.test.mjs e2e/*.test.mjs
      - run: npx --no-install tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8011
  browser:
    if: github.head_ref == 'codex/architecture-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-playwright-evidence
          path: .local-test/e2e-workspace/.local-test/playwright-results
          if-no-files-found: ignore
