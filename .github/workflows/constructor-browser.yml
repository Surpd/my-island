name: Constructor editing browser regressions

on:
  pull_request:
    paths:
      - '.github/workflows/constructor-browser.yml'
      - 'components/schedule-constructor*'
      - 'components/constructor-audience-recalculation.tsx'
      - 'backend/services/schedule_experiments.py'
      - 'e2e/audience-snapshot.spec.ts'
      - 'e2e/schedule-constructor-repair.spec.ts'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: >-
          npm run test:e2e -- e2e/audience-snapshot.spec.ts e2e/schedule-constructor-repair.spec.ts
          -g 'available-slot roster|constructor repair: sliding inspector|вид занятия и онлайн|Issue 21'
