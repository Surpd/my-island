name: Documentation links
on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/architecture-audit.yml'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative Markdown links
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          tracked = {
              pathlib.Path(name)
              for name in subprocess.check_output(
                  ["git", "ls-files", "-z"], text=True, encoding="utf-8"
              ).split("\0") if name
          }
          directories = {parent for path in tracked for parent in path.parents}
          missing = []
          for path in sorted(tracked):
              if path.suffix != ".md":
                  continue
              content = re.sub(r"(?ms)^(?:`{3,}|~{3,}).*?^(?:`{3,}|~{3,})[ \t]*$", "",
                               path.read_text(encoding="utf-8"))
              for target in re.findall(r"\]\((?:<([^>]+)>|([^\s)]+))", content):
                  url = urllib.parse.urlsplit(next(part for part in target if part))
                  if url.scheme or url.netloc or not url.path:
                      continue
                  candidate = (root / path.parent / urllib.parse.unquote(url.path)).resolve()
                  if (not candidate.is_relative_to(root)
                      or candidate.relative_to(root) not in tracked | directories):
                      missing.append(f"{path}: {url.path}")
          if missing:
              raise SystemExit("\n".join(missing))
          PY
