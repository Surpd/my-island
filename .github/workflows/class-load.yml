name: Class workload analytics

on:
  pull_request:
    paths:
      - 'backend/services/class_load_analytics.py'
      - 'backend/services/teacher_load_analytics.py'
      - 'backend/services/canonical_schedule.py'
      - 'backend/handlers/api.py'
      - 'backend/tests/test_canonical_schedule.py'
      - 'backend/tests/test_admin_previews.py'
      - 'backend/tests/test_class_load_analytics.py'
      - '.github/workflows/class-load.yml'

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest backend.tests.test_canonical_schedule backend.tests.test_admin_previews backend.tests.test_class_load_analytics -q
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: my_island_class_load_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55460:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CLASS_LOAD_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55460/my_island_class_load_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: |
          psql "$CLASS_LOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql "$CLASS_LOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/028_canonical_schedule_runtime.sql
          psql "$CLASS_LOAD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/migrations/030_canonical_effective_week_revisions.sql
      - run: python -m unittest backend.tests.test_class_load_postgres -v
