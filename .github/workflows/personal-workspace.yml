name: Personal workspace
on:
  pull_request:
    paths:
      - 'backend/services/personal_workspace.py'
      - 'backend/tests/test_personal_workspace.py'
      - 'backend/handlers/api.py'
      - '.github/workflows/personal-workspace.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest backend.tests.test_personal_workspace -v
