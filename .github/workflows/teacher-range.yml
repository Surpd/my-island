name: Teacher range contract

on:
  pull_request:
    paths:
      - 'backend/services/canonical_schedule.py'
      - 'backend/tests/test_canonical_schedule.py'
      - 'docs/SCHEDULE_TEACHER_RANGE_CONTRACT.md'
      - '.github/workflows/teacher-range.yml'

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest backend.tests.test_canonical_schedule -q
